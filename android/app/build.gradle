plugins { id 'com.android.application' }

if (file('google-services.json').exists()) apply plugin: 'com.google.gms.google-services'

def releaseSigningFile = rootProject.file('release-signing.properties')
def releaseSigning = new Properties()
if (releaseSigningFile.exists()) releaseSigningFile.withInputStream { releaseSigning.load(it) }

android {
    namespace 'org.nyimbo.agendi'
    compileSdk 36

    defaultConfig {
        applicationId 'org.nyimbo.agendi'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        javaCompileOptions {
            annotationProcessorOptions { arguments += ["room.schemaLocation": "$projectDir/schemas", "room.incremental": "true"] }
        }
        buildConfigField 'String', 'MAPS_API_KEY', '"' + (project.findProperty('MAPS_API_KEY') ?: '') + '"'
        manifestPlaceholders = [MAPS_API_KEY: project.findProperty('MAPS_API_KEY') ?: '']
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        release {
            if (releaseSigningFile.exists()) {
                storeFile rootProject.file(releaseSigning.getProperty('storeFile'))
                storePassword releaseSigning.getProperty('storePassword')
                keyAlias releaseSigning.getProperty('keyAlias')
                keyPassword releaseSigning.getProperty('keyPassword')
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions { unitTests.includeAndroidResources = true }
    buildTypes {
        debug {
            buildConfigField 'String', 'API_BASE_URL', '"' + (project.findProperty('NYIMBO_API_BASE_URL') ?: 'http://10.0.2.2:8080/api/v1/') + '"'
            buildConfigField 'boolean', 'OFFLINE_RELEASE', 'false'
        }
        release {
            buildConfigField 'String', 'API_BASE_URL', '"https://offline.invalid/api/v1/"'
            buildConfigField 'boolean', 'OFFLINE_RELEASE', 'true'
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.9.4'
    implementation 'androidx.room:room-runtime:2.8.3'
    annotationProcessor 'androidx.room:room-compiler:2.8.3'
    debugImplementation 'androidx.work:work-runtime:2.10.5'
    debugImplementation 'com.squareup.retrofit2:retrofit:3.0.0'
    debugImplementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    debugImplementation 'com.squareup.okhttp3:logging-interceptor:5.2.1'
    debugImplementation 'com.github.bumptech.glide:glide:4.16.0'
    debugAnnotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    debugImplementation 'com.google.android.gms:play-services-maps:19.2.0'
    debugImplementation platform('com.google.firebase:firebase-bom:35.1.0')
    debugImplementation 'com.google.firebase:firebase-messaging'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.room:room-testing:2.8.3'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
