services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nyimbo
      POSTGRES_USER: ${DATABASE_USERNAME:?Set DATABASE_USERNAME in .env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    volumes:
      - nyimbo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d nyimbo"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: ./backend
    environment:
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/nyimbo
      DATABASE_USERNAME: ${DATABASE_USERNAME:?Set DATABASE_USERNAME in .env}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      NYIMBO_ADMIN_USERNAME: ${NYIMBO_ADMIN_USERNAME:?Set NYIMBO_ADMIN_USERNAME in .env}
      NYIMBO_ADMIN_PASSWORD: ${NYIMBO_ADMIN_PASSWORD:?Set NYIMBO_ADMIN_PASSWORD in .env}
      FCM_ENABLED: ${FCM_ENABLED:-false}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      UPLOAD_DIR: /app/uploads
    ports:
      - "8080:8080"
    volumes:
      - nyimbo-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  nyimbo-postgres:
  nyimbo-uploads:
